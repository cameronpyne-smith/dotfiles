set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB:strikethrough'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'
setw -g mode-keys vi
bind -n S-Up copy-mode -u

set -ga terminal-features ',*:title'
set -g set-titles on
set -g set-titles-string '#S'

set -g pane-border-status top
set -g pane-border-format ' #P #{?@name,#{@name},#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#{pane_current_command},#{pane_title}}} '
set -g pane-active-border-style fg=colour39
bind T command-prompt -p "pane name:" "set -p @name '%%'"

# Save and restore sessions across reboots (tmux-resurrect + tmux-continuum).
# prefix C-s saves, prefix C-r restores, autosave every 10 min, restore on server start.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux
