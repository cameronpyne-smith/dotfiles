set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB:strikethrough'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[5 q'
setw -g mode-keys vi
bind -n S-Up copy-mode -u

set -ga terminal-features ',*:title'
set -g set-titles on
set -g set-titles-string '#S'

set -g pane-border-status top
set -g pane-border-format ' #P #{?@name,#{@name},#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#{pane_current_command},#{pane_title}}} '
set -g pane-active-border-style fg=colour39
bind T command-prompt -p "pane name:" "set -p @name '%%'"
